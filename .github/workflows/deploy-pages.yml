name: Build and deploy Owlbear extensions

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            owlbear-extension/package-lock.json
            vision-extension/package-lock.json

      - name: Install Party Book dependencies
        run: npm ci
        working-directory: owlbear-extension

      - name: Build Party Book
        run: npm run build
        working-directory: owlbear-extension
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Install Personal Vision dependencies
        run: npm ci
        working-directory: vision-extension

      - name: Build Personal Vision
        run: npm run build
        working-directory: vision-extension
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/vision/

      - name: Assemble Pages site
        run: |
          mkdir -p site/vision
          cp -R owlbear-extension/dist/. site/
          cp -R vision-extension/dist/. site/vision/
          touch site/.nojekyll

      - name: Verify assembled extension versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from "node:fs";
          for (const [path, expected] of [["site/manifest.json", "1.2.5"], ["site/vision/manifest.json", "0.3.4"]]) {
            const manifest = JSON.parse(readFileSync(path, "utf8"));
            console.log(`${manifest.name}: v${manifest.version} (${path})`);
            if (manifest.version !== expected) throw new Error(`Unexpected version in ${path}: ${manifest.version}`);
          }
          for (const path of ["site/vision/background.html", "site/vision/viewer.html", "site/vision/light-marker.svg"]) {
            if (!existsSync(path)) throw new Error(`Missing deployment file: ${path}`);
          }
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
